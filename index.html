<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>潜行深蓝 — 海洋科普探索</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --abyss: #07182C;
  --twilight: #0F2B46;
  --ocean: #1A4A7A;
  --surface: #2D7DD2;
  --sonar: #00D4AA;
  --coral: #FF6B6B;
  --gold: #FFC857;
  --foam: #E8F0F8;
  --card: #FFFFFF;
  --text: #1A2332;
  --text-secondary: #5A6B7F;
  --text-light: #8B9DC3;
  --border: #E2E8F0;
  --radius: 20px;
  --shadow: 0 4px 24px rgba(7, 24, 44, 0.08);
  --font-display: 'Space Grotesk', 'Noto Sans SC', system-ui, sans-serif;
  --font-body: 'Noto Sans SC', system-ui, -apple-system, sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--font-body);
  background: #F0F4F8;
  color: var(--text);
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  height: 100dvh;
  display: flex;
  flex-direction: column;
}

/* ── App Shell ── */
#app {
  flex: 1;
  display: flex;
  flex-direction: column;
  max-width: 480px;
  width: 100%;
  margin: 0 auto;
  position: relative;
  overflow: hidden;
  background: #F0F4F8;
}

/* ── Header ── */
.header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: linear-gradient(135deg, var(--abyss) 0%, var(--twilight) 60%, var(--ocean) 100%);
  padding: 16px 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  box-shadow: 0 4px 20px rgba(7, 24, 44, 0.3);
}

.header-logo {
  width: 32px; height: 32px;
  background: radial-gradient(circle at 40% 60%, var(--sonar), var(--surface));
  border-radius: 50%;
  box-shadow: 0 0 16px rgba(0, 212, 170, 0.4);
  animation: pulse-glow 3s ease-in-out infinite;
}

@keyframes pulse-glow {
  0%, 100% { box-shadow: 0 0 12px rgba(0, 212, 170, 0.3); }
  50% { box-shadow: 0 0 24px rgba(0, 212, 170, 0.6); }
}

.header-title {
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 700;
  color: #FFF;
  letter-spacing: 2px;
}

/* ── Page Container ── */
.pages {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding-bottom: 80px;
  scroll-behavior: smooth;
}

.page {
  display: none;
  animation: fadeSlideIn 0.25s ease;
}

.page.active {
  display: block;
}

@keyframes fadeSlideIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ── Bottom Tab Bar ── */
.tab-bar {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 480px;
  background: #FFF;
  border-top: 1px solid var(--border);
  display: flex;
  padding: 8px 0 env(safe-area-inset-bottom, 8px);
  z-index: 100;
  box-shadow: 0 -2px 12px rgba(7, 24, 44, 0.04);
}

.tab-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 6px 0;
  font-size: 11px;
  color: var(--text-light);
  cursor: pointer;
  transition: color 0.2s;
  border: none;
  background: none;
  font-family: var(--font-body);
}

.tab-item .tab-icon { font-size: 22px; line-height: 1; }
.tab-item.active { color: var(--surface); font-weight: 600; }
.tab-item:active { opacity: 0.7; }

/* ── Cards ── */
.card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 24px;
  margin: 16px;
  box-shadow: var(--shadow);
}

.section-title {
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 6px;
}

.section-subtitle {
  font-size: 13px;
  color: var(--text-secondary);
  margin-bottom: 20px;
}

/* ── Buttons ── */
.btn-primary {
  background: linear-gradient(135deg, var(--surface) 0%, #1E6FC5 100%);
  color: #FFF;
  border: none;
  border-radius: 50px;
  padding: 14px 36px;
  font-size: 15px;
  font-weight: 600;
  font-family: var(--font-body);
  cursor: pointer;
  letter-spacing: 0.5px;
  transition: all 0.2s;
  box-shadow: 0 4px 16px rgba(45, 125, 210, 0.3);
}

.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(45, 125, 210, 0.4); }
.btn-primary:active { transform: scale(0.98); opacity: 0.9; }

.btn-outline {
  background: transparent;
  color: var(--surface);
  border: 2px solid var(--surface);
  border-radius: 50px;
  padding: 12px 32px;
  font-size: 14px;
  font-weight: 600;
  font-family: var(--font-body);
  cursor: pointer;
  transition: all 0.2s;
}

.btn-outline:hover { background: rgba(45, 125, 210, 0.06); }
.btn-outline:active { transform: scale(0.98); }

.btn-sm {
  padding: 8px 20px;
  font-size: 13px;
}

/* ── Hero (Home) ── */
.hero {
  position: relative;
  height: 280px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  margin: 12px 16px 4px;
  border-radius: var(--radius);
}

.hero-bg {
  position: absolute; inset: 0;
  background: linear-gradient(175deg, #041020 0%, #0A2240 30%, #13477A 65%, #1E6FC5 100%);
}

.hero-rays {
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse at 50% 120%, rgba(0, 212, 170, 0.08) 0%, transparent 60%),
    radial-gradient(ellipse at 30% 100%, rgba(45, 125, 210, 0.1) 0%, transparent 50%),
    radial-gradient(ellipse at 70% 100%, rgba(45, 125, 210, 0.08) 0%, transparent 50%);
}

.hero-content {
  position: relative; z-index: 2;
  text-align: center;
  padding: 20px;
}

.hero-title {
  font-family: var(--font-display);
  font-size: 42px;
  font-weight: 700;
  color: #FFF;
  letter-spacing: 3px;
  text-shadow: 0 2px 20px rgba(0, 0, 0, 0.3);
  margin-bottom: 8px;
}

.hero-subtitle {
  font-size: 15px;
  color: rgba(255, 255, 255, 0.7);
  letter-spacing: 1px;
}

.hero-particles {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

/* ── Age Selector ── */
.age-selector {
  display: flex;
  gap: 10px;
  margin-top: 12px;
}

.age-card {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 16px 8px;
  border-radius: 16px;
  background: #F0F4F8;
  border: 2px solid transparent;
  cursor: pointer;
  transition: all 0.25s;
  font-family: var(--font-body);
}

.age-card:hover { background: #E3EDF7; }
.age-card.active {
  background: linear-gradient(135deg, #E3F2FD, #D4F1F4);
  border-color: var(--surface);
  box-shadow: 0 2px 12px rgba(45, 125, 210, 0.15);
}

.age-icon { font-size: 36px; margin-bottom: 4px; }
.age-label { font-size: 14px; font-weight: 600; color: var(--text); }
.age-desc { font-size: 11px; color: var(--text-light); margin-top: 2px; }

/* ── Entry Grid ── */
.entry-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 12px;
}

.entry-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 24px 12px;
  border-radius: 16px;
  background: linear-gradient(135deg, #F8FAFD, #EDF4FC);
  cursor: pointer;
  transition: all 0.2s;
  border: none;
  font-family: var(--font-body);
  text-align: center;
}

.entry-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(7, 24, 44, 0.08); }
.entry-card:active { transform: scale(0.97); }

.entry-icon { font-size: 40px; margin-bottom: 8px; }
.entry-title { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 2px; }
.entry-desc { font-size: 11px; color: var(--text-light); }

/* ── Daily Fact ── */
.fun-fact-card {
  background: linear-gradient(135deg, #FFFDF5, #FFF8E1);
  border-radius: 16px;
  padding: 20px;
  margin-top: 12px;
  border-left: 5px solid var(--gold);
}

.fact-label {
  font-size: 12px;
  font-weight: 600;
  color: #B8860B;
  text-transform: uppercase;
  letter-spacing: 2px;
  margin-bottom: 8px;
}

.fact-text {
  font-size: 14px;
  color: #795548;
  line-height: 1.7;
}

/* ── Quiz Selection ── */
.topic-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin: 20px 0;
}

.topic-card {
  flex: 0 0 calc(33.333% - 7px);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 16px 6px;
  border-radius: 14px;
  background: #F0F4F8;
  border: 2px solid transparent;
  cursor: pointer;
  transition: all 0.2s;
  font-family: var(--font-body);
}

.topic-card:hover { background: #E3EDF7; }
.topic-card.active {
  background: #E3F2FD;
  border-color: var(--surface);
}

.topic-icon { font-size: 32px; margin-bottom: 4px; }
.topic-label { font-size: 13px; font-weight: 600; color: var(--text); }

/* ── Quiz Playing ── */
.progress-wrap {
  margin: 12px 16px;
}

.progress-bar-bg {
  height: 6px;
  background: var(--border);
  border-radius: 3px;
  overflow: hidden;
}

.progress-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--surface), var(--sonar));
  border-radius: 3px;
  transition: width 0.3s ease;
}

.progress-info {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: var(--text-light);
  margin-top: 6px;
}

.q-tag {
  display: inline-block;
  font-size: 12px;
  color: var(--surface);
  background: #E3F2FD;
  padding: 4px 14px;
  border-radius: 30px;
  margin-bottom: 14px;
  font-weight: 500;
}

.q-text {
  font-size: 18px;
  font-weight: 600;
  color: var(--text);
  line-height: 1.6;
  margin-bottom: 24px;
}

.options-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.option {
  display: flex;
  align-items: center;
  padding: 14px 16px;
  border-radius: 14px;
  background: #F8FAFD;
  border: 2px solid transparent;
  cursor: pointer;
  transition: all 0.2s;
  font-family: var(--font-body);
  text-align: left;
}

.option:hover:not(.locked) { border-color: var(--surface); background: #EDF4FC; }

.option-letter {
  width: 38px; height: 38px;
  border-radius: 50%;
  background: var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  font-weight: 700;
  color: var(--text-secondary);
  margin-right: 14px;
  flex-shrink: 0;
  transition: all 0.2s;
}

.option.selected { border-color: var(--surface); background: #E3F2FD; }
.option.selected .option-letter { background: var(--surface); color: #FFF; }
.option.correct { border-color: var(--sonar); background: #E8FAF6; }
.option.correct .option-letter { background: var(--sonar); color: #FFF; }
.option.wrong { border-color: var(--coral); background: #FFF0EF; }
.option.wrong .option-letter { background: var(--coral); color: #FFF; }

.option-text {
  flex: 1;
  font-size: 15px;
  color: var(--text);
  line-height: 1.4;
}

.option-mark {
  font-size: 20px;
  font-weight: 700;
  margin-left: 10px;
}

.explanation {
  margin-top: 20px;
  padding: 18px;
  background: #F8FAFD;
  border-radius: 14px;
  border-left: 4px solid var(--surface);
  animation: fadeSlideIn 0.3s ease;
}

.exp-title { font-size: 15px; font-weight: 700; margin-bottom: 8px; }
.exp-text { font-size: 13px; color: var(--text-secondary); line-height: 1.7; }

.fun-fact-inline {
  margin-top: 12px;
  padding: 14px;
  background: #FFF8E1;
  border-radius: 10px;
  font-size: 13px;
  color: #795548;
  line-height: 1.6;
}

/* ── Quiz Result ── */
.result-wrap { text-align: center; padding: 30px 0; }
.result-icon { font-size: 80px; margin-bottom: 16px; }
.result-score { font-family: var(--font-display); font-size: 52px; font-weight: 700; color: var(--text); }
.result-label { font-size: 14px; color: var(--text-secondary); margin-bottom: 10px; }
.result-msg { font-size: 17px; color: var(--surface); font-weight: 600; margin-bottom: 24px; }

.result-stats {
  display: flex;
  justify-content: space-around;
  padding: 20px 0;
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  margin-bottom: 24px;
}

.stat-item { text-align: center; }
.stat-num { font-family: var(--font-display); font-size: 32px; font-weight: 700; color: var(--text); }
.stat-label { font-size: 12px; color: var(--text-light); margin-top: 2px; }

.result-btns {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* ── Explore ── */
.sim-tabs {
  display: flex;
  gap: 8px;
  margin: 0 16px 12px;
}

.sim-tab {
  flex: 1;
  text-align: center;
  padding: 10px 6px;
  border-radius: 14px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
  cursor: pointer;
  border: 2px solid transparent;
  background: var(--card);
  transition: all 0.2s;
  font-family: var(--font-body);
}

.sim-tab:hover { background: #F0F4F8; }
.sim-tab.active {
  background: linear-gradient(135deg, var(--surface), #1E6FC5);
  color: #FFF;
  box-shadow: 0 4px 14px rgba(45, 125, 210, 0.3);
}

.sim-canvas-wrap {
  margin: 0 16px;
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow);
  background: #0A1628;
}

.sim-canvas {
  display: block;
  width: 100%;
  height: 320px;
}

.sim-info {
  margin: 0 16px;
  padding: 20px;
  background: var(--card);
  border-radius: 0 0 var(--radius) var(--radius);
}

.sim-info-title {
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 8px;
}

.sim-info-text {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.7;
}

.sim-info-text .hl {
  color: var(--surface);
  font-weight: 600;
}

.sim-slider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 16px;
}

.sim-slider label { font-size: 12px; color: var(--text-secondary); white-space: nowrap; }
.sim-slider input { flex: 1; accent-color: var(--surface); }

.sim-stats-row {
  display: flex;
  justify-content: space-around;
  padding: 16px 0;
  margin-top: 14px;
  background: #F8FAFD;
  border-radius: 12px;
}

.sim-stat {
  text-align: center;
}

.sim-stat-val {
  font-family: var(--font-display);
  font-size: 28px;
  font-weight: 700;
  color: var(--surface);
}

.sim-stat-label { font-size: 11px; color: var(--text-light); }

.knowledge-line {
  margin: 16px;
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.7;
  padding: 20px;
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

/* ── Knowledge ── */
.cat-scroll {
  display: flex;
  gap: 8px;
  padding: 12px 16px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}

.cat-scroll::-webkit-scrollbar { display: none; }

.cat-chip {
  flex-shrink: 0;
  padding: 8px 18px;
  border-radius: 50px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
  background: var(--card);
  border: 2px solid var(--border);
  cursor: pointer;
  transition: all 0.2s;
  font-family: var(--font-body);
  white-space: nowrap;
}

.cat-chip:hover { border-color: var(--surface); }
.cat-chip.active {
  background: linear-gradient(135deg, var(--surface), #1E6FC5);
  color: #FFF;
  border-color: transparent;
}

.knowledge-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 24px;
  margin: 12px 16px;
  box-shadow: var(--shadow);
  transition: transform 0.2s;
}

.knowledge-card:hover { transform: translateY(-1px); }

.kc-tags {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
}

.kc-tag {
  font-size: 11px;
  padding: 4px 12px;
  border-radius: 30px;
  font-weight: 600;
}

.kc-cat { background: #E3F2FD; color: var(--surface); }
.kc-diff { background: #F3E5F5; color: #7B1FA2; }

.kc-title {
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 700;
  color: var(--text);
  line-height: 1.4;
  margin-bottom: 14px;
}

.kc-p {
  font-size: 14px;
  color: var(--text-secondary);
  line-height: 1.8;
  margin-bottom: 10px;
}

.kc-funfact {
  background: #FFF8E1;
  border-radius: 10px;
  padding: 14px;
  font-size: 13px;
  color: #795548;
  line-height: 1.7;
  margin-top: 10px;
}

.kc-source {
  font-size: 11px;
  color: var(--text-light);
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid var(--border);
}

.knowledge-card .kc-title { cursor: default; }

/* ── Empty State ── */
.empty-state {
  text-align: center;
  padding: 60px 20px;
}

.empty-icon { font-size: 80px; margin-bottom: 16px; }
.empty-msg { font-size: 18px; color: var(--text-secondary); margin-bottom: 8px; }
.empty-tip { font-size: 13px; color: var(--text-light); }

/* ── Toast ── */
.toast {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--abyss);
  color: #FFF;
  padding: 12px 24px;
  border-radius: 50px;
  font-size: 14px;
  font-weight: 500;
  z-index: 999;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
  box-shadow: 0 8px 24px rgba(7, 24, 44, 0.3);
}

.toast.show { opacity: 1; }

/* ── History (from home) ── */
.history-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--card);
  padding: 16px 20px;
  border-radius: 14px;
  margin: 8px 16px;
  box-shadow: 0 2px 8px rgba(7, 24, 44, 0.03);
}

.hi-left { display: flex; flex-direction: column; gap: 2px; }
.hi-date { font-size: 14px; font-weight: 600; }
.hi-topic { font-size: 11px; color: var(--text-light); }
.hi-score {
  font-family: var(--font-display);
  font-size: 28px;
  font-weight: 700;
}

.hi-score.great { color: var(--sonar); }
.hi-score.good { color: var(--gold); }
.hi-score.try { color: var(--coral); }

/* ── Responsive ── */
@media (min-width: 480px) {
  #app { border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
  .tab-bar {
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
    border-radius: 0;
  }
}
</style>
</head>
<body>

<div id="app">
  <!-- Header -->
  <div class="header">
    <div class="header-logo"></div>
    <span class="header-title">潜行深蓝</span>
  </div>

  <!-- Pages -->
  <div class="pages" id="pages">
    <!-- HOME -->
    <div class="page active" id="page-home">
      <div class="hero">
        <div class="hero-bg"></div>
        <div class="hero-rays"></div>
        <canvas class="hero-particles" id="heroCanvas"></canvas>
        <div class="hero-content">
          <div class="hero-title">潜行深蓝</div>
          <div class="hero-subtitle">探索海洋的奥秘，成为海洋小达人</div>
        </div>
      </div>

      <div class="card">
        <div class="section-title">🎯 选择你的年龄段</div>
        <div class="age-selector" id="ageSelector">
          <button class="age-card active" data-age="7" onclick="selectAge(7, this)">
            <span class="age-icon">🐠</span>
            <span class="age-label">6-9 岁</span>
            <span class="age-desc">入门探索者</span>
          </button>
          <button class="age-card" data-age="11" onclick="selectAge(11, this)">
            <span class="age-icon">🐬</span>

  { id:4,cat:'biology',catName:'海洋生物',diff:'进阶',title:'深海中的"灯光秀"——生物发光',ps:['超过76%的深海动物能自己发光！这种能力叫"生物发光"，是体内荧光素酶催化产生的冷光——几乎不产热。','发光在深海中是生存语言：鮟鱇鱼用发光器钓鱼，鱿鱼喷出发光墨汁逃跑，腹部发光消除剪影让下方捕食者看不到自己。'],fun:'鮟鱇鱼雌性比雄性大很多倍——雄性找到雌性后会"寄生"在她身体上融为一体！',src:'海洋科学知识库 - 深海发光生物'},
  { id:5,cat:'biology',catName:'海洋生物',diff:'挑战',title:'巨型管蠕虫——没有嘴也没有肠子',ps:['1977年阿尔文号潜水器在2500米深处发现深海热液喷口。"巨型管蠕虫"长达2.4米，没有口、没有消化道、没有肛门。','它们完全依赖体内的化能合成细菌提供营养：细菌利用硫化氢作为能源合成有机物。这是动物界独一无二的——体内有"细菌农场"生产食物。'],fun:'化能合成颠覆了"万物生长靠太阳"——深海热泉证明了生命可以不依赖太阳！',src:'海洋科学知识库 - 深海热液喷口化学'},
  { id:6,cat:'geography',catName:'海洋地理',diff:'入门',title:'马里亚纳海沟——地球最深处',ps:['位于西太平洋，最深处"挑战者深渊"约10,994米。把整座珠穆朗玛峰（8,848m）放进去，峰顶还在水下约2,000米。','底部水压超过1,000个大气压——相当于大拇指上放一头大象！但科学家在那里发现了狮子鱼、巨型端足类，甚至塑料垃圾。'],fun:'去过马里亚纳海沟底部的人比登过月球的人还少——大约只有27人！',src:'海洋科学知识库 - 马里亚纳海沟'},
  { id:7,cat:'geography',catName:'海洋地理',diff:'入门',title:'海水为什么是咸的？',ps:['海水盐分主要来自岩石风化。雨水冲刷陆地溶解岩石中的矿物质（包括盐），河流将这些矿物质带入海洋。','海水蒸发只蒸水不蒸盐——亿万年来盐分不断累积。这个循环已运行约38亿年——几乎和地球本身一样古老。'],fun:'如果海水全部蒸发，留下的盐可覆盖整个地球表面约45米厚！',src:'海洋科学知识库 - 海水盐分的来源'},
  { id:8,cat:'physics',catName:'海洋物理',diff:'进阶',title:'洋流——地球的"血液循环"',ps:['海洋中存在连接全球所有大洋的深层环流——"大洋传送带"。暖流将赤道热量送往高纬，寒流将冷水送回赤道。','它对全球气候至关重要：墨西哥湾流给欧洲"送温暖"，让伦敦远比同纬度的加拿大温暖宜居。一个完整循环约需1,000年。'],fun:'秘鲁渔场之所以是世界最大渔场之一，全靠洋流从深海带来的丰富营养盐！',src:'海洋科学知识库 - 洋流系统与全球传送带'},
  { id:9,cat:'physics',catName:'海洋物理',diff:'入门',title:'潮汐——月球拉动的海洋',ps:['潮汐主要由月球引力引起。月球拉着海水——正对月球一面隆起（涨潮），背面因离心力也涨潮。','大多数沿海地区一天有两次涨潮和退潮。太阳也会影响潮汐——新月和满月时潮汐特别大，叫"大潮"。'],fun:'加拿大芬迪湾的潮差可达16.3米——差不多五层楼高！',src:'海洋科学知识库 - 潮汐的成因'},
  { id:10,cat:'pollution',catName:'海洋环保',diff:'入门',title:'海洋中的塑料——看不见的危机',ps:['每年约800万吨塑料排入海洋，相当于每分钟倒一卡车的塑料。这些塑料不会消失，只会碎成越来越小的微塑料。','微塑料被浮游动物吃下，通过食物链层层传递，最终可能出现在我们吃的大鱼甚至我们自己身体里。马里亚纳海沟底部也发现了塑料。'],fun:'一个普通塑料瓶在海洋中需要约450年才能分解——比人的寿命长好几倍！',src:'海洋科学知识库 - 海洋塑料污染'},
  { id:11,cat:'pollution',catName:'海洋环保',diff:'进阶',title:'"幽灵渔具"——海中的永恒陷阱',ps:['幽灵渔具是被遗弃在海里的渔网、鱼笼和鱼线。这些渔具会继续"捕猎"——缠绕和杀死鱼类、海龟、海鸟和鲸类年复一年。','一张被遗弃的大型流网可长达数公里，在海上漂荡数十年。占海洋塑料污染的约10%。被缠住的动物挣扎声又会吸引更多动物——恶性循环。'],fun:'大太平洋垃圾带的塑料垃圾中约46%的质量来自废弃渔网！',src:'海洋科学知识库 - 海洋塑料污染'},
  { id:12,cat:'pollution',catName:'海洋环保',diff:'挑战',title:'海洋酸化——CO₂的隐藏代价',ps:['海洋吸收了人类排放CO₂的约30%——CO₂溶于海水形成碳酸，释放氢离子，导致pH下降——"海洋酸化"。','自工业革命以来，海洋表层pH从8.2降至8.1。看似只差0.1，但pH是对数尺度——代表酸度增加了约26%。更酸的海水让珊瑚、贝类更难形成外壳。'],fun:'如果人类血液pH变化0.1，你会在几分钟内昏迷——海洋的"酸中毒"严重得多。',src:'海洋科学知识库 - 海洋酸化机制'},
  { id:13,cat:'ecosystem',catName:'海洋生态',diff:'入门',title:'珊瑚——动物还是植物？',ps:['珊瑚看起来像彩色石头或花朵，但它们其实是动物！成千上万只微小的"珊瑚虫"聚居形成了珊瑚。','珊瑚虫体内住着虫黄藻——一种单细胞藻类。虫黄藻通过光合作用给珊瑚提供约90%的能量，也赋予珊瑚鲜亮颜色。'],fun:'珊瑚礁只占海洋面积不到1%，但养育了超过25%的海洋生物物种！',src:'海洋科学知识库 - 珊瑚共生系统'},
  { id:14,cat:'ecosystem',catName:'海洋生态',diff:'进阶',title:'珊瑚白化——美丽消失的背后',ps:['当海水温度异常升高（哪怕只1-2°C），珊瑚受胁迫排出共生虫黄藻。失去藻类的珊瑚变白——这就是"白化"。','白化的珊瑚没有死！如果水温在2-4周内回落，珊瑚可以恢复。如果高温持续超过4-8周，失去90%能量来源的珊瑚就会饿死。2023-2024年第四次全球白化已被确认。'],fun:'珊瑚在每年满月后的夜晚"集体婚礼"——数十种珊瑚同时释放精子和卵子，形成海底"暴风雪"！',src:'海洋科学知识库 - 珊瑚白化成因与应对'},
  { id:15,cat:'ecosystem',catName:'海洋生态',diff:'入门',title:'鲸落——死亡中的生命奇迹',ps:['当一头鲸在深海中死去，身体缓缓沉入海底，会创造一个全新生态系统——"鲸落"（Whale Fall）。','这个过程持续数十年：先是食腐动物吃掉软组织，然后蠕虫占据骨骼，最后细菌利用骨骼脂质产生能量——不依赖阳光的微型生态系统就此诞生。'],fun:'一鲸落，万物生——一头死鲸带来的养分相当于这里两千年间自然沉降有机物的总和！',src:'海洋科学知识库 - 鲸类的迁徙与智慧'},
  { id:16,cat:'physics',catName:'海洋物理',diff:'挑战',title:'ENSO——太平洋的"三年之痒"',ps:['ENSO（厄尔尼诺-南方涛动）是地球上最强的年际气候波动。厄尔尼诺年份，太平洋暖水从西边回流到东边——太平洋"感冒"，全世界"打喷嚏"。','拉尼娜则是厄尔尼诺的反相：信风异常增强，暖水堆积更极端。周期通常为2-7年。2023-24年强厄尔尼诺叠加全球变暖，使2023年成为有记录以来最热年份。'],fun:'"厄尔尼诺"意思是"圣婴"——温暖海水常在圣诞节前后抵达秘鲁，被渔民比作耶稣圣婴！',src:'海洋科学知识库 - 厄尔尼诺与拉尼娜'}
];

//  APP STATE
// ═══════════════════════════════════════
const state = {
  userAge: 8,
  difficulty: 0,
  currentTab: 'home',
  quizState: 'idle', // idle|playing|finished
  selectedTopic: 'all',
  questions: [],
  currentIndex: 0,
  selectedOption: -1,
  answered: false,
  correctCount: 0,
  activeSim: 'tide',
};

// ═══════════════════════════════════════
//  TAB SWITCHING
// ═══════════════════════════════════════
function switchTab(tab) {
  state.currentTab = tab;
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + tab).classList.add('active');
  document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
  document.querySelector(`.tab-item[data-tab="${tab}"]`).classList.add('active');

  document.getElementById('pages').scrollTop = 0;

  if (tab === 'quiz') resetQuizUI();
  if (tab === 'explore') { initSimCanvas(); startSimLoop(); }
  if (tab === 'knowledge') renderKnowledge();
}

// ═══════════════════════════════════════
//  AGE SELECTION
// ═══════════════════════════════════════
function selectAge(age, el) {
  state.userAge = age;
  state.difficulty = age <= 9 ? 0 : (age <= 12 ? 1 : 2);
  document.querySelectorAll('.age-card').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  try { localStorage.setItem('oceanUserAge', age); } catch(e) {}
  showToast('难度已切换为 ' + diffNames[state.difficulty]);
}

// ═══════════════════════════════════════
//  QUIZ ENGINE
// ═══════════════════════════════════════
function selectTopic(topic, el) {
  state.selectedTopic = topic;
  document.querySelectorAll('#topicGrid .topic-card').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
}

function resetQuizUI() {
  state.quizState = 'idle';
  state.selectedOption = -1;
  state.answered = false;
  document.getElementById('quizSelection').style.display = 'block';
  document.getElementById('quizPlaying').style.display = 'none';
  document.getElementById('quizResult').style.display = 'none';
  document.getElementById('quizDiffName').textContent = diffNames[state.difficulty];
}

function startQuiz() {
  let pool = questionBank.filter(q => q.difficulty === state.difficulty);
  if (state.selectedTopic !== 'all') pool = pool.filter(q => q.topic === state.selectedTopic);

  // Not enough, pull from lower difficulty
  if (pool.length < 8 && state.difficulty > 0) {
    const lower = questionBank.filter(q => {
      if (state.selectedTopic !== 'all') return q.difficulty === state.difficulty - 1 && q.topic === state.selectedTopic;
      return q.difficulty === state.difficulty - 1;
    });
    pool = pool.concat(lower);
  }

  if (pool.length < 3) { showToast('题目不够，请选择全部主题'); return; }

  // Shuffle
  for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  state.questions = pool.slice(0, Math.min(12, pool.length));
  state.currentIndex = 0;
  state.correctCount = 0;
  state.answered = false;
  state.selectedOption = -1;
  state.quizState = 'playing';

  document.getElementById('quizSelection').style.display = 'none';
  document.getElementById('quizResult').style.display = 'none';
  document.getElementById('quizPlaying').style.display = 'block';
  renderQuestion();
}

function renderQuestion() {
  const q = state.questions[state.currentIndex];
  const idx = state.currentIndex;
  const total = state.questions.length;

  document.getElementById('progressBar').style.width = ((idx / total) * 100) + '%';
  document.getElementById('progressCount').textContent = `第 ${idx + 1} / ${total} 题`;
  document.getElementById('progressTopic').textContent = `${topicNames[q.topic] || ''} · ${q.type === 'truefalse' ? '判断题' : '单选题'}`;

  const card = document.getElementById('questionCard');
  card.innerHTML = `
    <span class="q-tag">${topicNames[q.topic] || ''} · ${q.type === 'truefalse' ? '判断题' : '单选题'}</span>
    <div class="q-text">${q.question}</div>
    <div class="options-list" id="optionsList">
      ${q.options.map((opt, i) => `
        <button class="option" data-index="${i}" onclick="answerQuestion(${i}, this)">
          <span class="option-letter">${optionLetters[i]}</span>
          <span class="option-text">${opt}</span>
        </button>
      `).join('')}
    </div>
    <div id="explanationArea"></div>
  `;

  document.getElementById('nextBtnWrap').hidden = true;
  state.answered = false;
  state.selectedOption = -1;
}

function answerQuestion(index, el) {
  if (state.answered) return;
  state.answered = true;
  state.selectedOption = index;

  const q = state.questions[state.currentIndex];
  const isCorrect = index === q.answer;
  if (isCorrect) state.correctCount++;

  // Highlight options
  const options = document.querySelectorAll('#optionsList .option');
  options.forEach((opt, i) => {
    opt.classList.add('locked');
    if (i === q.answer) opt.classList.add('correct');
    if (i === index && i !== q.answer) opt.classList.add('wrong');
    if (i === index) opt.classList.add('selected');
  });

  // Show explanation
  const icon = isCorrect ? '✅' : '❌';
  const title = isCorrect ? '回答正确！' : '再想一想';
  document.getElementById('explanationArea').innerHTML = `
    <div class="explanation">
      <div class="exp-title">${icon} ${title}</div>
      <div class="exp-text">${q.explanation}</div>
      ${q.funFact ? `<div class="fun-fact-inline">💡 ${q.funFact}</div>` : ''}
    </div>
  `;

  const nextWrap = document.getElementById('nextBtnWrap');
  nextWrap.hidden = false;
  const isLast = state.currentIndex >= state.questions.length - 1;
  document.getElementById('nextBtn').textContent = isLast ? '查看结果' : '下一题';
}

function nextQuestion() {
  if (state.currentIndex >= state.questions.length - 1) {
    showResult();
    return;
  }
  state.currentIndex++;
  state.answered = false;
  state.selectedOption = -1;
  renderQuestion();
}

function showResult() {
  state.quizState = 'finished';
  const total = state.questions.length;
  const correct = state.correctCount;
  const pct = Math.round((correct / total) * 100);

  document.getElementById('quizPlaying').style.display = 'none';
  document.getElementById('quizResult').style.display = 'block';

  let icon, msg;
  if (pct >= 90) { icon = '🎉'; msg = '你简直是海洋小博士！'; }
  else if (pct >= 70) { icon = '👏'; msg = '很不错，继续探索海洋的奥秘！'; }
  else if (pct >= 50) { icon = '📚'; msg = '还有进步空间，多多学习哦！'; }
  else { icon = '🌊'; msg = '别灰心，海洋还有很多等着你去发现！'; }

  document.getElementById('resultContent').innerHTML = `
    <div class="result-icon">${icon}</div>
    <div class="result-score">${correct} / ${total}</div>
    <div class="result-label">正确率 ${pct}%</div>
    <div class="result-msg">${msg}</div>
    <div class="result-stats">
      <div class="stat-item"><div class="stat-num">${correct}</div><div class="stat-label">正确</div></div>
      <div class="stat-item"><div class="stat-num">${total - correct}</div><div class="stat-label">错误</div></div>
      <div class="stat-item"><div class="stat-num">${diffNames[state.difficulty]}</div><div class="stat-label">难度</div></div>
    </div>
    <div class="result-btns">
      <button class="btn-primary" onclick="resetQuizUI();document.getElementById('quizSelection').style.display='block';document.getElementById('quizResult').style.display='none';">再来一局</button>
      <button class="btn-outline" onclick="switchTab('home')">返回首页</button>
    </div>
  `;

  // Save history
  try {
    const history = JSON.parse(localStorage.getItem('oceanHistory') || '[]');
    history.unshift({
      date: new Date().toLocaleDateString('zh-CN'),
      score: `${correct}/${total}`,
      percent: pct,
      diffName: diffNames[state.difficulty],
      topic: state.selectedTopic === 'all' ? '全部' : (topicNames[state.selectedTopic] || '综合')
    });
    if (history.length > 20) history.pop();
    localStorage.setItem('oceanHistory', JSON.stringify(history));
  } catch(e) {}
}

// ═══════════════════════════════════════
//  SIMULATIONS
// ═══════════════════════════════════════
let simAnimId = null;
let simData = { windStrength: 3, depthLevel: 0, tideSpeed: 3 };

function switchSim(sim, el) {
  state.activeSim = sim;
  document.querySelectorAll('.sim-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  updateSimInfo();
}

function initSimCanvas() {
  const canvas = document.getElementById('simCanvas');
  if (!canvas) return;
  const rect = canvas.parentElement.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = rect.width * dpr;
  canvas.height = 320 * dpr;
  canvas.style.width = rect.width + 'px';
  canvas.style.height = '320px';
}

function startSimLoop() {
  if (simAnimId) cancelAnimationFrame(simAnimId);
  updateSimInfo();
  function loop() {
    drawSim();
    simAnimId = requestAnimationFrame(loop);
  }
  loop();
}

function drawSim() {
  const canvas = document.getElementById('simCanvas');
  if (!canvas || document.getElementById('page-explore').classList.contains('active') === false) return;
  const ctx = canvas.getContext('2d');
  const w = canvas.width;
  const h = canvas.height;
  const dpr = window.devicePixelRatio || 1;
  const dw = w / dpr;
  const dh = h / dpr;
  ctx.save();
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, dw, dh);

  if (state.activeSim === 'tide') drawTide(ctx, dw, dh);
  else if (state.activeSim === 'current') drawCurrent(ctx, dw, dh);
  else if (state.activeSim === 'wave') drawWave(ctx, dw, dh);
  else if (state.activeSim === 'depth') drawDepth(ctx, dw, dh);

  ctx.restore();
}

function drawTide(ctx, w, h) {
  const t = Date.now() / 1000;
  const speed = simData.tideSpeed / 5;
  const tideH = Math.sin(t * speed) * (h * 0.2) + h * 0.5;

  // Background
  const bg = ctx.createLinearGradient(0, 0, 0, h);
  bg.addColorStop(0, '#0A1628'); bg.addColorStop(0.5, '#0F2B46'); bg.addColorStop(1, '#1A4A7A');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h);

  // Stars
  ctx.fillStyle = '#FFF';
  for (let i = 0; i < 20; i++) {
    ctx.globalAlpha = 0.3 + Math.sin(t * 3 + i) * 0.3;
    ctx.beginPath(); ctx.arc(w * 0.2 + i * w * 0.04, h * 0.05 + (i % 3) * 20, 1.5, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Moon
  const mx = w * 0.8, my = h * 0.15;
  const moonGrad = ctx.createRadialGradient(mx, my, 5, mx, my, 28);
  moonGrad.addColorStop(0, '#FFFDE7'); moonGrad.addColorStop(1, '#FFC857');
  ctx.fillStyle = moonGrad; ctx.beginPath(); ctx.arc(mx, my, 28, 0, Math.PI * 2); ctx.fill();

  // Moon glow
  const glowGrad = ctx.createRadialGradient(mx, my, 25, mx, my, 60);
  glowGrad.addColorStop(0, 'rgba(255, 200, 87, 0.2)'); glowGrad.addColorStop(1, 'rgba(255, 200, 87, 0)');
  ctx.fillStyle = glowGrad; ctx.beginPath(); ctx.arc(mx, my, 60, 0, Math.PI * 2); ctx.fill();

  // Earth/ocean
  ctx.save(); ctx.translate(w * 0.35, h * 0.5);
  // Ellipse with tidal bulge
  const rx = w * 0.2, ry = h * 0.32;
  const bulge = (tideH - h * 0.5) * 0.6;
  ctx.beginPath();
  ctx.ellipse(0, 0, rx + bulge * 0.4, ry + bulge * 0.3, 0, 0, Math.PI * 2);
  const waterGrad = ctx.createLinearGradient(-rx, 0, rx, 0);
  waterGrad.addColorStop(0, 'rgba(30, 144, 255, 0.25)');
  waterGrad.addColorStop(0.5, 'rgba(30, 144, 255, 0.45)');
  waterGrad.addColorStop(1, 'rgba(30, 144, 255, 0.25)');
  ctx.fillStyle = waterGrad; ctx.fill();
  ctx.strokeStyle = 'rgba(30, 144, 255, 0.7)'; ctx.lineWidth = 2; ctx.stroke();
  ctx.restore();

  // Tidal label
  const height = (3.2 + Math.sin(t * speed) * 2.5).toFixed(1);
  const phase = Math.sin(t * speed) > 0 ? '涨潮中 ↑' : '退潮中 ↓';
  ctx.fillStyle = '#FFF'; ctx.font = '600 16px "Noto Sans SC", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(`${phase} · 潮高 ${height}m`, w * 0.5, h * 0.88);
}

function drawCurrent(ctx, w, h) {
  const t = Date.now() / 1000;
  const bg = ctx.createLinearGradient(0, 0, 0, h);
  bg.addColorStop(0, '#0D3B66'); bg.addColorStop(1, '#07182C');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h);

  // Land masses
  ctx.fillStyle = '#1a3a5c'; ctx.fillRect(0, 0, w * 0.12, h); ctx.fillRect(w * 0.88, 0, w * 0.12, h);

  const currents = [
    { y: h * 0.22, c: '#FF6B6B', s: 1.2 },
    { y: h * 0.42, c: '#4FC3F7', s: -0.7 },
    { y: h * 0.62, c: '#FF6B6B', s: 0.9 },
    { y: h * 0.82, c: '#4FC3F7', s: -0.6 },
  ];

  currents.forEach(cur => {
    const offset = (t * cur.s * 80) % w;
    ctx.globalAlpha = 0.5;
    for (let x = -w * 0.5; x < w * 1.5; x += 16) {
      const wy = cur.y + Math.sin((x + offset) * 0.015 + t) * 6;
      const r = 3 + Math.sin(x * 0.1 + t * 2) * 2;
      ctx.fillStyle = cur.c;
      ctx.beginPath(); ctx.arc(x, wy, r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  });

  ctx.fillStyle = '#FFF'; ctx.font = '14px "Noto Sans SC", sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('暖流 →', w * 0.55, h * 0.19);
  ctx.fillText('← 寒流', w * 0.45, h * 0.39);
  ctx.fillText('暖流 →', w * 0.55, h * 0.59);
  ctx.fillText('← 寒流', w * 0.45, h * 0.79);

  ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.font = '600 16px "Noto Sans SC", sans-serif';
  ctx.fillText('全球洋流 · 海洋的"血液循环"', w * 0.5, h * 0.93);
}

function drawWave(ctx, w, h) {
  const t = Date.now() / 1000;
  const wind = simData.windStrength / 5;
  const amp = wind * h * 0.15;

  const sky = ctx.createLinearGradient(0, 0, 0, h * 0.45);
  sky.addColorStop(0, '#7EC8E3'); sky.addColorStop(1, '#B8E4F0');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, w, h * 0.45);

  // Sun
  ctx.fillStyle = '#FFF9C4'; ctx.beginPath(); ctx.arc(w * 0.8, h * 0.15, 35, 0, Math.PI * 2); ctx.fill();

  // Water
  ctx.beginPath();
  ctx.moveTo(0, h * 0.4);
  for (let x = 0; x <= w; x += 2) {
    const y = h * 0.4 + Math.sin(x * 0.01 + t * 2) * amp * 0.7 + Math.sin(x * 0.035 + t * 3.5) * amp * 0.3 + Math.sin(x * 0.06 + t * 1.5) * amp * 0.15;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(w, h); ctx.lineTo(0, h); ctx.closePath();
  const waterGrad = ctx.createLinearGradient(0, h * 0.35, 0, h);
  waterGrad.addColorStop(0, 'rgba(30, 144, 255, 0.75)');
  waterGrad.addColorStop(0.4, 'rgba(13, 59, 102, 0.85)');
  waterGrad.addColorStop(1, '#07182C');
  ctx.fillStyle = waterGrad; ctx.fill();

  // Foam
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, h * 0.4);
  for (let x = 0; x <= w; x += 2) {
    const y = h * 0.4 + Math.sin(x * 0.01 + t * 2) * amp * 0.7;
    ctx.lineTo(x, y);
  }
  ctx.stroke();

  ctx.fillStyle = '#FFF'; ctx.font = '600 16px "Noto Sans SC", sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(`风力强度: ${simData.windStrength}/10`, w * 0.5, h * 0.92);
}

function drawDepth(ctx, w, h) {
  const level = simData.depthLevel / 100;
  const darken = level * 0.9 + 0.05;

  const depthGrad = ctx.createLinearGradient(0, 0, 0, h);
  depthGrad.addColorStop(0, `rgba(14, 167, 232, ${1 - darken})`);
  depthGrad.addColorStop(0.3, `rgba(10, 100, 180, ${1 - darken * 0.7})`);
  depthGrad.addColorStop(0.6, `rgba(5, 40, 90, ${1 - darken * 0.5})`);
  depthGrad.addColorStop(1, `rgba(2, 10, 30, 1)`);
  ctx.fillStyle = depthGrad; ctx.fillRect(0, 0, w, h);

  // Light rays
  for (let i = 0; i < 6; i++) {
    const rx = w * 0.15 + i * w * 0.14;
    const alpha = Math.max(0, 0.12 - level * 0.1);
    const rayGrad = ctx.createLinearGradient(rx, 0, rx, h * 0.5);
    rayGrad.addColorStop(0, `rgba(255, 255, 255, ${alpha})`);
    rayGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
    ctx.fillStyle = rayGrad;
    ctx.beginPath();
    ctx.moveTo(rx - (8 - level * 6), 0);
    ctx.lineTo(rx + (8 - level * 6), 0);
    ctx.lineTo(rx + 4, h * 0.45);
    ctx.lineTo(rx - 4, h * 0.45);
    ctx.closePath(); ctx.fill();
  }

  // Bioluminescence
  const particles = Math.floor(level * 20);
  const t = Date.now() / 1000;
  for (let i = 0; i < particles; i++) {
    const px = (i * w * 0.13 + t * (5 + i * 3)) % w;
    const py = h * 0.25 + (i * h * 0.06) % (h * 0.7);
    const a = 0.3 + Math.sin(t * 4 + i) * 0.3;
    ctx.fillStyle = `rgba(100, 255, 218, ${a})`;
    ctx.beginPath(); ctx.arc(px, py, 1.5, 0, Math.PI * 2); ctx.fill();
  }

  const depthM = Math.floor(level * 11000);
  const zones = ['海面（透光层）','浅水层 ~50m','中层 ~200m','中层 ~500m','深海 ~800m','深海 1000m+','深渊 3000m+','超深渊 6000m+'];
  const zi = Math.min(Math.floor(level * 7), 7);

  ctx.fillStyle = '#FFF'; ctx.font = '600 16px "Noto Sans SC", sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(`${depthM}m — ${zones[zi]}`, w * 0.5, h * 0.85);
  ctx.fillText(level > 0.5 ? '🔬 超过76%的深海生物会发光' : '☀️ 蓝光可穿透200米以上', w * 0.5, h * 0.92);
}

function updateSimInfo() {
  const info = {
    tide: { title:'🌙 潮汐模拟', text:'月球引力牵引地球海水，正对和背对月球两侧同时涨潮。大多数沿海地区一天有两次涨退潮。', fact:'芬迪湾（加拿大）拥有世界最大潮差（16.3米），当地地形与月球引潮周期形成"共振"。', slider: true, sliderLabel: '播放速度', sliderVal: simData.tideSpeed, sliderFn: 'onTideSpeed' },
    current: { title:'🔄 洋流系统', text:'暖流（红线）将赤道热量带向极地，寒流（蓝线）将冷水送回赤道。<span class="hl">一个完整大洋环流走一圈大约需要1,000年！</span>', fact:'黑潮（Kuroshio）是太平洋西边界最强暖流之一，每秒输送约5000万立方米的水——相当于200条长江。', slider: false },
    wave: { title:'🌊 波浪生成', text:'风吹过海面将能量传递给海水。风越大、吹的距离越长，波浪越高。', fact:'海啸波长可达数百公里，在深海中航行速度接近喷气式飞机。但在海面上你几乎感觉不到它。', slider: true, sliderLabel: '风力强度', sliderVal: simData.windStrength, sliderFn: 'onWindStrength' },
    depth: { title:'📏 海洋深度', text:'红色光约5米消失，蓝色光能穿透到200米以上。200米以下是永恒黑暗。<span class="hl">最深处的挑战者深渊约10,994米。</span>', fact:'马里亚纳海沟最深处压力超1,000大气压。到过那里的人比登月的人还少——大约只有27人。', slider: true, sliderLabel: '下潜深度', sliderVal: simData.depthLevel, sliderFn: 'onDepthLevel' }
  };

    <div class="sim-info-title">${d.title}</div>

    ${d.slider ? `<div class="sim-slider"><label>${d.sliderLabel}</label><input type="range" min="1" max="10" value="${d.sliderVal}" oninput="${d.sliderFn}(this.value)"></div>` : ''}
  `;
  document.getElementById('simFact').textContent = '💡 ' + d.fact;
}

function onTideSpeed(v) { simData.tideSpeed = parseInt(v); }
function onWindStrength(v) { simData.windStrength = parseInt(v); }
function onDepthLevel(v) { simData.depthLevel = parseInt(v); }

let knowledgeFilter = 'all';
function renderKnowledge() {
  const cats = [
    { id:'all', name:'全部', icon:'📋' },
    { id:'biology', name:'海洋生物', icon:'🐋' },
    { id:'geography', name:'海洋地理', icon:'🌍' },
    { id:'pollution', name:'海洋环保', icon:'♻️' },
    { id:'ecosystem', name:'海洋生态', icon:'🪸' },
    { id:'physics', name:'海洋物理', icon:'⚡' }
  ];

  document.getElementById('catScroll').innerHTML = cats.map(c => `
    <button class="cat-chip ${c.id === knowledgeFilter ? 'active' : ''}" onclick="filterKnowledge('${c.id}', this)">${c.icon} ${c.name}</button>
  `).join('');

  renderKnowledgeCards();
}

function filterKnowledge(cat, el) {
  knowledgeFilter = cat;
  document.querySelectorAll('#catScroll .cat-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  renderKnowledgeCards();
}

function renderKnowledgeCards() {
  const filtered = knowledgeFilter === 'all' ? knowledgeCards : knowledgeCards.filter(c => c.cat === knowledgeFilter);
  document.getElementById('knowledgeList').innerHTML = filtered.map(c => `
    <div class="knowledge-card">
      <div class="kc-tags">
        <span class="kc-tag kc-cat">${c.catName}</span>
        <span class="kc-tag kc-diff">📘 ${c.diff}</span>
      </div>
      <div class="kc-title">${c.title}</div>
      ${c.ps.map(p => `<div class="kc-p">${p}</div>`).join('')}
      ${c.fun ? `<div class="kc-funfact">💡 ${c.fun}</div>` : ''}
      <div class="kc-source">📖 来源：${c.src}</div>
    </div>
  `).join('');
}

// ═══════════════════════════════════════
//  HISTORY
// ═══════════════════════════════════════
function showHistory() {
  const history = JSON.parse(localStorage.getItem('oceanHistory') || '[]');
  const section = document.getElementById('historySection');

  if (history.length === 0) {
    showToast('还没有答题记录哦');
    return;
  }

  const total = history.length;
  const avg = Math.round(history.reduce((s, i) => s + i.percent, 0) / total);
  const best = Math.max(...history.map(i => i.percent));

  document.getElementById('historyStats').innerHTML = `
    <div class="stat-item"><div class="stat-num">${total}</div><div class="stat-label">总挑战次数</div></div>
    <div class="stat-item"><div class="stat-num">${avg}%</div><div class="stat-label">平均正确率</div></div>
    <div class="stat-item"><div class="stat-num">${best}%</div><div class="stat-label">最佳成绩</div></div>
  `;

  document.getElementById('historyList').innerHTML = history.map(h => {
    const cls = h.percent >= 80 ? 'great' : (h.percent >= 50 ? 'good' : 'try');
    return `<div class="history-item">
      <div class="hi-left"><span class="hi-date">${h.date}</span><span class="hi-topic">${h.topic} · ${h.diffName}</span></div>
      <div><span class="hi-score ${cls}">${h.percent}%</span></div>
    </div>`;
  }).join('');

  section.style.display = 'block';
  section.scrollIntoView({ behavior: 'smooth' });
}

function clearHistory() {
  if (confirm('确定要清除所有答题记录吗？')) {
    localStorage.removeItem('oceanHistory');
    showToast('记录已清除');
    document.getElementById('historySection').style.display = 'none';
  }
}

// ═══════════════════════════════════════
//  TOAST
// ═══════════════════════════════════════
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timeout);
  t._timeout = setTimeout(() => t.classList.remove('show'), 1800);
}

// ═══════════════════════════════════════
//  HERO PARTICLES
// ═══════════════════════════════════════
function initHeroParticles() {
  const canvas = document.getElementById('heroCanvas');
  if (!canvas) return;
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width;
  canvas.height = rect.height;

  const ctx = canvas.getContext('2d');
  const particles = [];
  for (let i = 0; i < 30; i++) {
    particles.push({
      x: Math.random() * rect.width,
      y: Math.random() * rect.height,
      r: 0.5 + Math.random() * 1.5,
      vy: 0.2 + Math.random() * 0.4,
      alpha: 0.3 + Math.random() * 0.5,
      phase: Math.random() * Math.PI * 2
    });
  }

  function anim() {
    ctx.clearRect(0, 0, rect.width, rect.height);
    const t = Date.now() / 1000;
    particles.forEach(p => {
      p.y += p.vy;
      if (p.y > rect.height + 10) { p.y = -10; p.x = Math.random() * rect.width; }
      const a = p.alpha * (0.7 + 0.3 * Math.sin(t * 2 + p.phase));
      ctx.fillStyle = `rgba(255, 255, 255, ${a})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    });
    requestAnimationFrame(anim);
  }
  anim();
}

document.addEventListener('DOMContentLoaded', () => {
  // Load saved age
  try {
    const savedAge = parseInt(localStorage.getItem('oceanUserAge'));
    if (savedAge) {
      state.userAge = savedAge;
      state.difficulty = savedAge <= 9 ? 0 : (savedAge <= 12 ? 1 : 2);
      document.querySelectorAll('.age-card').forEach(c => c.classList.remove('active'));
      const target = document.querySelector(`.age-card[data-age="${savedAge}"]`);
      if (target) target.classList.add('active');
    }
  } catch(e) {}

  // Daily fact
  document.getElementById('dailyFactText').textContent = dailyFacts[Math.floor(Math.random() * dailyFacts.length)];

  // Init
  document.getElementById('quizDiffName').textContent = diffNames[state.difficulty];
  initHeroParticles();
  renderKnowledge();

  // Handle tab bar clicks from inside pages
  window.addEventListener('resize', () => {
    if (state.currentTab === 'explore') initSimCanvas();
  });
});
